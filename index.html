<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-brand">
                <i data-lucide="wallet" class="header-icon"></i>
                <h1 class="header-title">Expense &amp; Budget Visualizer</h1>
            </div>
            <button id="themeToggleBtn" class="btn-icon" title="Toggle tema" aria-label="Toggle dark/light mode">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- BALANCE CARD -->
        <section class="balance-card" aria-label="Total saldo">
            <p class="balance-label">Total Pengeluaran</p>
            <p class="balance-amount" id="totalBalance">Rp 0</p>
            <p class="balance-sub" id="balanceSub">0 transaksi tercatat</p>
        </section>

        <!-- TWO-COLUMN LAYOUT -->
        <div class="grid-main">

            <!-- LEFT COLUMN: Form + Monthly Summary -->
            <div class="col-left">

                <!-- INPUT FORM -->
                <section class="card" aria-label="Form tambah transaksi">
                    <h2 class="card-title">Tambah Transaksi</h2>
                    <form id="transactionForm" novalidate>

                        <div class="form-group">
                            <label for="itemName">Nama Item <span class="required">*</span></label>
                            <input type="text" id="itemName" placeholder="Contoh: Makan siang" autocomplete="off" />
                            <span class="error-msg" id="itemNameError"></span>
                        </div>

                        <div class="form-group">
                            <label for="itemAmount">Jumlah (Rp) <span class="required">*</span></label>
                            <input type="number" id="itemAmount" placeholder="Contoh: 25000" min="1" />
                            <span class="error-msg" id="itemAmountError"></span>
                        </div>

                        <div class="form-group">
                            <label for="itemDate">Tanggal <span class="required">*</span></label>
                            <input type="date" id="itemDate" />
                            <span class="error-msg" id="itemDateError"></span>
                        </div>

                        <div class="form-group">
                            <label for="itemCategory">Kategori <span class="required">*</span></label>
                            <select id="itemCategory">
                                <option value="">-- Pilih Kategori --</option>
                                <option value="Makanan">🍔 Makanan</option>
                                <option value="Transportasi">🚌 Transportasi</option>
                                <option value="Hiburan">🎮 Hiburan</option>
                            </select>
                            <span class="error-msg" id="itemCategoryError"></span>
                        </div>

                        <button type="submit" class="btn-primary" id="submitBtn">
                            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
                            <span>Tambah Transaksi</span>
                        </button>
                    </form>
                </section>

                <!-- CUSTOM CATEGORY -->
                <section class="card" aria-label="Tambah kategori kustom">
                    <h2 class="card-title">Kategori Kustom</h2>
                    <div class="custom-cat-form">
                        <input type="text" id="customCatInput" placeholder="Nama kategori baru..." maxlength="30"
                            autocomplete="off" />
                        <button id="addCategoryBtn" class="btn-secondary">Tambah</button>
                    </div>
                    <span class="error-msg" id="customCatError"></span>
                    <div id="customCategoryList" class="custom-cat-list" aria-label="Daftar kategori kustom"></div>
                </section>

                <!-- MONTHLY SUMMARY -->
                <section class="card" aria-label="Ringkasan bulanan">
                    <h2 class="card-title">Ringkasan Bulanan</h2>
                    <div id="monthlySummary" class="monthly-list">
                        <p class="empty-state">Belum ada data.</p>
                    </div>
                </section>

            </div><!-- end col-left -->

            <!-- RIGHT COLUMN: Chart + Transaction List -->
            <div class="col-right">

                <!-- PIE CHART -->
                <section class="card chart-card" aria-label="Grafik pengeluaran per kategori">
                    <h2 class="card-title">Distribusi Pengeluaran</h2>
                    <div class="chart-wrapper">
                        <canvas id="expenseChart" aria-label="Pie chart distribusi pengeluaran"></canvas>
                    </div>
                    <p class="empty-state" id="chartEmptyState">Belum ada data untuk ditampilkan.</p>
                </section>

                <!-- TRANSACTION LIST -->
                <section class="card" aria-label="Daftar transaksi">
                    <div class="list-header">
                        <h2 class="card-title">Riwayat Transaksi</h2>
                        <button id="clearAllBtn" class="btn-danger-sm" title="Hapus semua transaksi">
                            <i data-lucide="trash-2" style="width: 12px; height: 12px;"></i>
                            Hapus Semua
                        </button>
                    </div>

                    <!-- Sorting and Threshold Controls -->
                    <div class="controls-row">
                        <div class="control-group">
                            <label for="sortSelect">
                                <i data-lucide="arrow-down-up" style="width: 14px; height: 14px;"></i>
                                Urutkan:
                            </label>
                            <select id="sortSelect" class="control-select">
                                <option value="newest">Terbaru</option>
                                <option value="oldest">Terlama</option>
                                <option value="highest">Tertinggi</option>
                                <option value="lowest">Terendah</option>
                                <option value="category">Kategori</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="thresholdInput">
                                <i data-lucide="alert-circle" style="width: 14px; height: 14px;"></i>
                                Alert (Rp):
                            </label>
                            <input type="number" id="thresholdInput" class="control-input" placeholder="0" min="0" />
                        </div>
                    </div>

                    <div id="transactionList" class="transaction-list" role="list">
                        <p class="empty-state" id="listEmptyState">Belum ada transaksi.</p>
                    </div>
                </section>

            </div><!-- end col-right -->

        </div><!-- end grid-main -->

    </main>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</body>

</html>
