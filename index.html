<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense & Budget Visualizer</title>

    <!-- Font External: Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheet Utama & Chart.js Library -->
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>

<body>

    <!-- Header Utama Aplikasi -->
    <header class="app-header">
        <div class="app-header__inner">
            <div class="app-header__brand">
                <i data-lucide="wallet" class="app-header__icon"></i>
                <h1 class="app-header__title">Expense &amp; Budget Visualizer</h1>
            </div>
            <button id="themeToggleBtn" class="btn-icon" title="Toggle tema" aria-label="Toggle dark/light mode">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Konten Utama Aplikasi -->
    <main class="app-container">

        <!-- Kartu Ringkasan Total Saldo/Pengeluaran -->
        <section class="balance-card" aria-label="Total saldo">
            <p class="balance-card__label">Total Pengeluaran</p>
            <p class="balance-card__amount" id="totalBalance">Rp 0</p>
            <p class="balance-card__subtitle" id="balanceSub">0 transaksi tercatat</p>
        </section>

        <!-- Tata Letak 2 Kolom -->
        <div class="main-grid">

            <!-- Kolom Kiri: Form Input & Ringkasan Bulanan -->
            <div class="main-grid__col-left">

                <!-- Formulir Tambah Transaksi Baru -->
                <section class="card" aria-label="Form tambah transaksi">
                    <h2 class="card__title">Tambah Transaksi</h2>
                    <form id="transactionForm" class="form" novalidate>

                        <div class="form__group">
                            <label for="itemName" class="form__label">Nama Item <span class="form__required">*</span></label>
                            <input type="text" id="itemName" class="form__input" placeholder="Contoh: Makan siang" autocomplete="off" />
                            <span class="form__error" id="itemNameError"></span>
                        </div>

                        <div class="form__group">
                            <label for="itemAmount" class="form__label">Jumlah (Rp) <span class="form__required">*</span></label>
                            <input type="number" id="itemAmount" class="form__input" placeholder="Contoh: 25000" min="1" />
                            <span class="form__error" id="itemAmountError"></span>
                        </div>

                        <div class="form__group">
                            <label for="itemDate" class="form__label">Tanggal <span class="form__required">*</span></label>
                            <input type="date" id="itemDate" class="form__input" />
                            <span class="form__error" id="itemDateError"></span>
                        </div>

                        <div class="form__group">
                            <label for="itemCategory" class="form__label">Kategori <span class="form__required">*</span></label>
                            <select id="itemCategory" class="form__select">
                                <option value="">-- Pilih Kategori --</option>
                                <option value="Makanan">🍔 Makanan</option>
                                <option value="Transportasi">🚌 Transportasi</option>
                                <option value="Hiburan">🎮 Hiburan</option>
                            </select>
                            <span class="form__error" id="itemCategoryError"></span>
                        </div>

                        <button type="submit" class="btn btn--primary" id="submitBtn">
                            <i data-lucide="plus" class="btn__icon"></i>
                            <span>Tambah Transaksi</span>
                        </button>
                    </form>
                </section>

                <!-- Formulir Tambah Kategori Kustom -->
                <section class="card" aria-label="Tambah kategori kustom">
                    <h2 class="card__title">Kategori Kustom</h2>
                    <div class="custom-category-form">
                        <input type="text" id="customCatInput" class="custom-category-form__input" placeholder="Nama kategori baru..." maxlength="30" autocomplete="off" />
                        <button id="addCategoryBtn" class="btn btn--secondary">Tambah</button>
                    </div>
                    <span class="form__error" id="customCatError"></span>
                    <div id="customCategoryList" class="custom-category-list" aria-label="Daftar kategori kustom"></div>
                </section>

                <!-- Ringkasan Pengeluaran Bulanan -->
                <section class="card" aria-label="Ringkasan bulanan">
                    <h2 class="card__title">Ringkasan Bulanan</h2>
                    <div id="monthlySummary" class="monthly-summary-list">
                        <p class="empty-state">Belum ada data.</p>
                    </div>
                </section>

            </div>

            <!-- Kolom Kanan: Grafik Visualisasi & Riwayat Transaksi -->
            <div class="main-grid__col-right">

                <!-- Grafik Distribusi Pengeluaran (Pie Chart) -->
                <section class="card card--chart" aria-label="Grafik pengeluaran per kategori">
                    <h2 class="card__title">Distribusi Pengeluaran</h2>
                    <div class="chart-container">
                        <canvas id="expenseChart" aria-label="Pie chart distribusi pengeluaran"></canvas>
                    </div>
                    <p class="empty-state" id="chartEmptyState">Belum ada data untuk ditampilkan.</p>
                </section>

                <!-- Daftar Riwayat Transaksi -->
                <section class="card" aria-label="Daftar transaksi">
                    <div class="card__header">
                        <h2 class="card__title">Riwayat Transaksi</h2>
                        <button id="clearAllBtn" class="btn btn--danger-sm" title="Hapus semua transaksi">
                            <i data-lucide="trash-2" class="btn__icon"></i>
                            Hapus Semua
                        </button>
                    </div>

                    <!-- Panel Kontrol: Pengurutan & Alert Batas Pengeluaran -->
                    <div class="controls-bar">
                        <div class="controls-bar__group">
                            <label for="sortSelect" class="controls-bar__label">
                                <i data-lucide="arrow-down-up" class="controls-bar__icon"></i>
                                Urutkan:
                            </label>
                            <select id="sortSelect" class="controls-bar__select">
                                <option value="newest">Terbaru</option>
                                <option value="oldest">Terlama</option>
                                <option value="highest">Tertinggi</option>
                                <option value="lowest">Terendah</option>
                                <option value="category">Kategori</option>
                            </select>
                        </div>
                        <div class="controls-bar__group">
                            <label for="thresholdInput" class="controls-bar__label">
                                <i data-lucide="alert-circle" class="controls-bar__icon"></i>
                                Alert (Rp):
                            </label>
                            <input type="number" id="thresholdInput" class="controls-bar__input" placeholder="0" min="0" />
                        </div>
                    </div>

                    <!-- Tempat Daftar Transaksi Diberikan -->
                    <div id="transactionList" class="transaction-list" role="list">
                        <p class="empty-state" id="listEmptyState">Belum ada transaksi.</p>
                    </div>
                </section>

            </div>

        </div>

    </main>

    <!-- Notifikasi Toast -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Script External (Lucide Icons & JS Aplikasi) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/app.js"></script>
</body>

</html>
